<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bro2 · 通用 Agent 运行时</title>
<style>
:root{
  --bg:#f5f7fa; --panel:#ffffff; --panel-2:#f0f3f8; --border:#dfe4ec;
  --text:#1c2330; --muted:#6b7688; --accent:#2f6feb; --accent-soft:#e8f0ff;
  --ok:#17845c; --warn:#c8820c; --err:#c0392b; --code:#f7f9fc;
  --shadow:0 1px 3px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.05);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#11151c;--panel:#181e28;--panel-2:#1e2632;--border:#2b3543;--text:#e6ebf2;--muted:#8d99ab;--accent:#5b8dff;--accent-soft:#1e2c48;--ok:#3fbe8c;--warn:#e0a83c;--err:#ef6a5a;--code:#141a23;--shadow:0 1px 3px rgba(0,0,0,.3)}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.app{display:grid;grid-template-columns:236px minmax(0,1fr) 330px;grid-template-rows:52px minmax(0,1fr);height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:var(--shadow);z-index:3}
.brand{font-weight:750;font-size:15px;letter-spacing:.2px;white-space:nowrap}
.brand span{color:var(--accent)}
.badge{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:650}
.hgap{flex:1}
header label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
select{background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:5px 8px;outline:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
aside{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.side-title{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 14px 8px}
.side-actions{display:flex;gap:6px;padding:0 12px 10px}
.btn{background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.sm{padding:4px 8px;font-size:11px}
.session-list{overflow:auto;flex:1;padding:0 8px 12px}
.sess{padding:9px 10px;border-radius:7px;cursor:pointer;margin-bottom:3px;border:1px solid transparent}
.sess:hover{background:var(--panel-2)}
.sess.active{background:var(--accent-soft);border-color:var(--accent)}
.sess .t{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .m{font-size:10px;color:var(--muted);margin-top:2px}
.sess .run{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:5px;box-shadow:0 0 0 3px rgba(23,132,92,.18);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.wb-scope{display:flex;gap:0;margin:0 12px 8px;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.wb-scope button{flex:1;border:0;background:transparent;color:var(--muted);font-size:10.5px;padding:6px;cursor:pointer}
.wb-scope button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.ev-task{font-size:9.5px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 5px}
.global-count{font-size:10px;color:var(--ok);font-weight:650}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#stream{flex:1;overflow:auto;padding:18px 22px;scroll-behavior:smooth}
.msg{margin-bottom:16px;max-width:860px}
.msg .who{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;display:flex;gap:8px;align-items:center}
.msg .body{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 14px;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow)}
.msg.user .body{background:var(--accent-soft);border-color:transparent}
.msg.assistant .body{background:var(--panel)}
.msg.system .body{background:transparent;border-style:dashed;color:var(--muted);font-size:11px;padding:7px 12px}
.tool-card{border:1px solid var(--border);border-radius:8px;background:var(--panel);margin:8px 0;overflow:hidden;max-width:860px;box-shadow:var(--shadow)}
.tool-head{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--panel-2);cursor:pointer;font-size:11.5px}
.tool-head .nm{font-weight:700;color:var(--accent);font-family:ui-monospace,Menlo,monospace}
.tool-head .st{margin-left:auto;font-size:10px;padding:1px 7px;border-radius:9px;background:var(--panel);color:var(--muted)}
.tool-head .st.ok{color:var(--ok)}.tool-head .st.fail{color:var(--err)}
.tool-body{display:none;padding:9px 12px;border-top:1px solid var(--border)}
.tool-card.open .tool-body{display:block}
.tool-body pre{margin:0;background:var(--code);border-radius:6px;padding:9px;max-height:240px;overflow:auto;font-size:11px;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Menlo,monospace}
.tool-body .lbl{font-size:10px;color:var(--muted);margin:6px 0 3px;font-weight:650}
.composer{border-top:1px solid var(--border);background:var(--panel);padding:10px 16px 14px}
.composer-row{display:flex;gap:9px;align-items:flex-end}
textarea{flex:1;resize:none;height:62px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;outline:none}
textarea:focus{border-color:var(--accent)}
.hint{font-size:10.5px;color:var(--muted);margin-top:6px}
.right{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 8px}
.tab{padding:10px 10px;font-size:11.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.panel{flex:1;overflow:auto;padding:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--panel-2);border-radius:8px;padding:9px 11px}
.kpi .n{font-size:17px;font-weight:750;color:var(--accent)}
.kpi .l{font-size:10px;color:var(--muted)}
.tr{display:flex;gap:7px;padding:5px 6px;border-bottom:1px solid var(--border);font-size:10.5px}
.tr .s{color:var(--muted);min-width:26px;font-family:ui-monospace,monospace}
.tr .ty{font-weight:650;min-width:104px;font-family:ui-monospace,monospace;color:var(--accent)}
.tr .sm{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maf-sec{border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:9px;background:var(--panel-2)}.maf-sec h4{margin:0 0 8px;font-size:12px}.maf-grid{display:grid;grid-template-columns:1fr;gap:8px}.maf-card{border:1px solid var(--border);border-radius:7px;padding:8px;background:var(--panel);font-size:10.5px;overflow-wrap:anywhere;min-width:0}.maf-card b{font-family:ui-monospace,monospace;font-size:10.5px}.maf-actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.maf-actions .btn{font-size:9.5px;padding:3px 7px}.maf-stat{display:inline-block;margin-right:9px;color:var(--muted)}.maf-badge{padding:1px 5px;border-radius:4px;background:var(--code);font-size:9px}.maf-ok{color:var(--ok)}.maf-warn{color:var(--warn)}.maf-err{color:var(--err)}
.rowitem{padding:8px 9px;border:1px solid var(--border);border-radius:7px;margin-bottom:6px;background:var(--panel-2)}
.rowitem b{font-family:ui-monospace,monospace;font-size:11px}
.rowitem p{margin:3px 0 0;font-size:10.5px;color:var(--muted)}
.risk{font-size:9px;padding:1px 5px;border-radius:4px;background:var(--panel);margin-left:5px}
.risk.danger{color:var(--err)}.risk.write{color:var(--warn)}.risk.safe{color:var(--ok)}
pre.code{background:var(--code);border-radius:7px;padding:10px;font-size:10.5px;max-height:320px;overflow:auto;white-space:pre-wrap}
.modal-mask{position:fixed;inset:0;background:rgba(10,15,25,.5);display:none;align-items:center;justify-content:center;z-index:20}
.modal-mask.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;width:min(460px,92vw);padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px;font-size:15px}
.modal .r{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:12px}
/* 白盒事件流 */
:root{--faint:#9aa5b5}
@media(prefers-color-scheme:dark){:root{--faint:#677384}}
.wb-banner{font-size:10px;color:var(--muted);background:var(--panel-2);border:1px solid var(--border);border-radius:7px;padding:7px 9px;margin:0 12px 8px;line-height:1.7}
.wb-banner b{color:var(--warn);font-weight:750}
.wb-legend{display:flex;gap:9px;margin-top:3px;flex-wrap:wrap}
.src-live-t{color:var(--ok)}.src-ledger-t{color:var(--accent)}.src-replay-t{color:var(--warn)}
.flow{padding-left:2px}
.ev-item{position:relative;padding:0 0 9px 20px}
.ev-item::before{content:"";position:absolute;left:6px;top:16px;bottom:0;width:2px;background:var(--border)}
.ev-item:last-child::before{display:none}
.ev-node{position:absolute;left:0;top:6px;width:14px;height:14px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1.5px var(--border)}
.ev-card{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer}
.ev-card:hover{border-color:var(--accent)}
.ev-card.sel{border-color:var(--accent);background:var(--accent-soft)}
.ev-top{display:flex;align-items:center;gap:6px}
.ev-type{font-weight:700;font-size:11px;font-family:ui-monospace,monospace;color:var(--accent)}
.ev-seq{margin-left:auto;font-size:9px;color:var(--faint)}
.ev-meta{font-size:10px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lane-tag{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:650}
.lane-exec{background:var(--accent-soft);color:var(--accent)}
.lane-fly{background:rgba(23,132,92,.13);color:var(--ok)}
.lane-model{background:rgba(200,130,12,.15);color:var(--warn)}
.lane-harness{background:rgba(192,57,43,.12);color:var(--err)}
.src-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.src-live{background:var(--ok)}.src-ledger{background:var(--accent)}.src-replay{background:var(--warn)}
.ev-detail{display:none;margin-top:7px;padding-top:7px;border-top:1px solid var(--border)}
.ev-card.sel .ev-detail{display:block}
.ev-detail pre{margin:0;background:var(--code);border-radius:6px;padding:8px;font-size:10px;max-height:200px;white-space:pre-wrap;word-break:break-all}
.ev-note{font-size:9.5px;color:var(--warn);margin-top:5px}
.wb-actions{display:flex;gap:6px;flex-wrap:wrap;padding:9px 12px;border-top:1px solid var(--border)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--text);color:var(--bg);padding:9px 15px;border-radius:8px;font-size:12px;opacity:0;transition:.25s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1000px){.app{grid-template-columns:200px minmax(0,1fr)}.right{display:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Agent <span>OS</span></div>
    <div class="badge">Harness v1.0</div>
    <span class="dot" id="dot"></span><span style="font-size:11px;color:var(--muted)" id="statusText">连接中…</span>
    <div class="hgap"></div>
    <label>Preset <select id="presetSel"></select></label>
    <label>模型 <select id="modelSel"></select></label>
  </header>

  <aside>
    <div class="side-title">任务总览 <span class="global-count" id="runCount"></span></div>
    <div class="side-actions">
      <button class="btn primary" id="newBtn">＋ 新建</button>
      <button class="btn" id="forkBtn">分叉</button>
    </div>
    <div class="session-list" id="sessions"><div class="empty">加载中…</div></div>
    <div class="side-title" style="border-top:1px solid var(--border);padding-top:12px">运行时</div>
    <div style="padding:0 12px 14px;font-size:10.5px;color:var(--muted)" id="runtimeInfo">—</div>
  </aside>

  <main>
    <div id="stream"><div class="empty">选择一个会话，或直接输入任务开始。<br/>这是通用 Agent 运行时：工具调用、审批与执行轨迹都会实时显示在这里。</div></div>
    <div class="composer">
      <div class="composer-row">
        <textarea id="input" placeholder="描述你的任务…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="btn primary" id="sendBtn" style="height:62px;padding:0 20px">发送</button>
      </div>
      <div class="hint">可用 <code>/help</code> 类能力通过工具调用；高危操作会弹出审批。离线 Mock 模型即可跑通完整闭环。</div>
    </div>
  </main>

  <div class="right">
    <div class="tabs">
      <div class="tab on" data-tab="trace">事件流</div>
      <div class="tab" data-tab="maf">MAF 工作台</div>
      <div class="tab" data-tab="rebuild">重建</div>
      <div class="tab" data-tab="metrics">指标</div>
      <div class="tab" data-tab="tools">工具</div>
      <div class="tab" data-tab="skills">技能</div>
    </div>
    <div class="wb-scope"><button class="on" data-scope="all">🌐 全局事件流（所有任务）</button><button data-scope="focus">🎯 聚焦当前任务</button></div>
    <div class="wb-banner"><b>来源标注</b> <span class="src-live-t">● LIVE 真实 EventBus·SSE 实时</span> · <span class="src-ledger-t">● LEDGER 只增账本回放</span> · <span class="src-replay-t">● REPLAY evidence 回放（非实时）</span><div class="wb-legend">全局视野监控本进程所有任务 · 每条带来源与任务标签 · 仅凭此流可重建决策链</div></div>
    <div class="panel" id="panel"></div>
    <div class="wb-actions">
      <button class="btn sm" id="rebuildBtn">⟳ 重建决策链</button>
      <button class="btn sm" id="tamperBtn">🔍 篡改自检</button>
      <button class="btn sm primary" id="exportBtn">⬇ 导出审计快照</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3>⚠ 需要人工审批</h3>
    <div class="r" id="modalReason"></div>
    <pre class="code" id="modalArgs"></pre>
    <div class="acts">
      <button class="btn" data-dec="deny">拒绝</button>
      <button class="btn" data-dec="approve">批准本次</button>
      <button class="btn primary" data-dec="always">本会话始终允许</button>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = { sessionId: null, status: {}, tab: "trace", sending: false, assistantEl: null, calls: {}, approvalId: null, traceEvents: [], replayEvents: [], globalEvents: [], running: new Set(), scope: "all", sessionTitles: {}, ledgerMaxSeq: {}, maf: null, mafTasks: [], mafAudit: [], mafCluster: null };
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2200); };
// 事件类型 → 四条 lane 的映射；来源由注入方式决定，不由事件自报
const LANE_OF = {
  "run.start":"exec","run.end":"exec","message.user":"exec","message.assistant":"exec",
  "tool.call":"exec","tool.result":"exec","tool.repair":"exec","grounding.reject":"exec",
  "guard.advisory":"exec","guard.budget-advisory":"exec","guard":"exec","error":"exec",
  "subagent.start":"exec","subagent.end":"exec","automation":"exec","approval.request":"exec","approval.resolved":"exec",
  "metrics":"fly","context.compaction":"fly",
  "hook.fired":"model",
  "context.inject":"harness"
};
const LANE_NAME = { exec:"任务执行", fly:"轨迹沉淀", model:"模型进化", harness:"harness 进化" };
const LANE_COLOR = { exec:"var(--accent)", fly:"var(--ok)", model:"var(--warn)", harness:"var(--err)" };
const SRC_NAME = { live:"LIVE 真实流", ledger:"LEDGER 账本回放", replay:"REPLAY evidence 回放" };
const SRC_LABEL = { live:"LIVE", ledger:"LEDGER", replay:"REPLAY" };

async function api(path, opts = {}) {
  const token = localStorage.getItem("agentos_token");
  const headers = { ...(opts.headers || {}), ...(token ? { authorization: "Bearer " + token } : {}) };
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) {
    const t = prompt("此实例需要访问令牌");
    if (t) { localStorage.setItem("agentos_token", t); location.reload(); }
    throw new Error("未授权");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
const post = (path, body) => api(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });

function addMsg(role, text, cls = "") {
  const box = $("#stream");
  const empty = box.querySelector(".empty");
  if (empty) empty.remove();
  const d = document.createElement("div");
  d.className = `msg ${role} ${cls}`;
  d.innerHTML = `<div class="who">${role === "user" ? "你" : role === "assistant" ? "Agent" : "系统"}</div><div class="body"></div>`;
  d.querySelector(".body").textContent = text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}

function addToolCard(call) {
  const box = $("#stream");
  const d = document.createElement("div");
  d.className = "tool-card open";
  d.innerHTML = `<div class="tool-head"><span class="nm">${esc(call.name)}</span><span class="st">执行中</span></div>
    <div class="tool-body"><div class="lbl">参数</div><pre>${esc(JSON.stringify(call.arguments, null, 2))}</pre><div class="lbl">结果</div><pre class="out">等待返回…</pre></div>`;
  d.querySelector(".tool-head").onclick = () => d.classList.toggle("open");
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  state.calls[call.id] = d;
}

function finishToolCard(r) {
  const d = state.calls[r.callId];
  if (!d) return;
  const st = d.querySelector(".st");
  st.textContent = r.ok ? `✓ ${r.elapsedMs ?? 0}ms` : "✗ 失败";
  st.className = `st ${r.ok ? "ok" : "fail"}`;
  d.querySelector(".out").textContent = r.ok ? (r.output ?? "(空输出)") : (r.error ?? "未知错误");
  $("#stream").scrollTop = $("#stream").scrollHeight;
}

function showApproval(req) {
  state.approvalId = req.id;
  $("#modalReason").textContent = `${req.toolName} · ${req.reason}`;
  $("#modalArgs").textContent = JSON.stringify(req.arguments, null, 2);
  $("#modalMask").classList.add("on");
}
function hideApproval() { state.approvalId = null; $("#modalMask").classList.remove("on"); }

function onEvent(e) {
  state.traceEvents.push({ ...e, _src: "live" });
  const p = e.payload || {};
  if (e.type === "tool.call") {
    for (const c of (p.calls || [])) addToolCard(c);
  } else if (e.type === "tool.result") {
    finishToolCard(p.result || {});
  } else if (e.type === "approval.request") {
    showApproval(p.request || {});
  } else if (e.type === "approval.resolved") {
    hideApproval();
  } else if (e.type === "guard" || e.type === "error") {
    addMsg("system", `[${e.type}] ${JSON.stringify(p).slice(0, 300)}`);
  } else if (e.type === "context.compaction") {
    addMsg("system", `上下文已压缩，移除 ${p.removed} 条早期消息`);
  } else if (e.type === "subagent.start" || e.type === "subagent.end") {
    addMsg("system", `${e.type === "subagent.start" ? "派生子 Agent" : "子 Agent 结束"} · ${esc(p.task || "")} [${esc(p.preset || "")}]`);
  }
  if (state.tab === "trace") renderTrace();
}

async function send() {
  if (state.sending) return;
  const text = $("#input").value.trim();
  if (!text) return;
  $("#input").value = "";
  state.sending = true;
  $("#sendBtn").textContent = "运行中…";
  $("#sendBtn").disabled = true;
  addMsg("user", text);

      <svg viewBox="0 0 280 54" style="width:100%;height:54px;background:var(--code);border-radius:6px"><polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="2"/>${growth.map((r, i) => `<circle cx="${8 + i * Math.max(12, 260 / Math.max(1, growth.length - 1))}" cy="${46 - Math.max(-1, Math.min(1, Number(r.delta))) * 38}" r="2" fill="var(--ok)"/>`).join("")}</svg>
      <div style="font-size:9.5px;color:var(--muted);margin-top:5px">有效评测 ${growth.length} 条；正 Δ 不代表可宣称通用能力提升，需专项迁移 + 全局回归独立证据。</div>
      ${shared.length ? shared.map((b) => `<div class="maf-card" style="margin-top:7px"><b>${esc(b.id)}@${esc(b.version)}</b> <span class="maf-badge">${esc(b.status)}</span><div>实测域 ${esc((b.measuredDomain || []).join(", "))} · 证据 ${esc((b.evidenceRefs || []).join(", "))}</div>
        ${b.status === "shadow" ? `<div class="maf-actions"><button class="btn" data-maf="promote-block" data-id="${esc(b.id)}" data-transfer="${esc(transfer?.id || "")}" data-global="${esc(global?.id || "")}">双门禁晋升共享能力</button></div>` : ""}</div>`).join("") : '<div class="empty" style="margin-top:7px">暂无共享能力；从已评测专家版本蒸馏</div>'}
    </div>
    <div class="maf-sec"><h4>持久任务 DAG · 恢复 / 幂等 / 取消</h4>
      ${state.mafTasks.length ? state.mafTasks.slice().reverse().map((t) => `<div class="maf-card"><b>${esc(t.name)}</b> <span class="maf-badge">${esc(t.status)}</span> <code>${esc(t.id)}</code>
        <div>${t.nodes.map((n) => `${esc(n.id)}:${esc(n.status)}×${n.attempts}`).join(" · ")}</div>
        <div class="maf-actions"><button class="btn" data-maf="run-task" data-id="${esc(t.id)}">运行/恢复</button><button class="btn" data-maf="cancel-task" data-id="${esc(t.id)}">取消</button></div></div>`).join("") : '<div class="empty">暂无持久任务；运行 active TaskAgent 会自动创建</div>'}
    </div>
    <div class="maf-sec"><h4>只增治理审计（最近 8 条）</h4><pre class="code">${esc(JSON.stringify(state.mafAudit.slice(-8), null, 2))}</pre></div>`;
  document.querySelectorAll("[data-maf]").forEach((el) => el.onclick = async () => {
    const act = el.dataset.maf, id = el.dataset.id, ver = el.dataset.ver;
    try {
      if (act === "demo") await mafDemo();
      else if (act === "cluster-refresh") { await loadMaf(); toast("✓ 集群状态已刷新"); }
      else if (act === "evaluate") await mafPost("/api/maf/evaluate", { agentId: id, version: ver }, "四类评测完成");
      else if (act === "publish") await mafPost("/api/maf/publish", { agentId: id, version: ver, actor: "web-user" }, "原子发布完成");
      else if (act === "publish-limited") await mafPost("/api/maf/publish", { agentId: id, version: ver, actor: "web-user", allowLimitedEvidence: true }, "有限证据影子发布（不宣称显著）");
      else if (act === "rollback") await mafPost("/api/maf/rollback", { agentId: id, targetVersion: ver, actor: "web-user" }, "完整快照回滚完成");
      else if (act === "revoke") await mafPost("/api/maf/revoke", { agentId: id, actor: "web-user" }, "已撤权");
      else if (act === "distill") await mafPost("/api/maf/distill", { agentId: id, version: ver, actor: "web-user" }, "能力候选已蒸馏为 shadow");
      else if (act === "promote-block") await mafPost("/api/maf/promote-block", { blockId: id, transferReportId: el.dataset.transfer, globalReportId: el.dataset.global, actor: "web-user" }, "共享能力双门禁已判定");
      else if (act === "run-agent") {
        const task = $("#mafTaskInput")?.value || "检查代码格式并给出结论";
        const created = await post("/api/maf/tasks", { name: `TaskAgent ${id}`, nodes: [{ id: "execute", task, domain: el.dataset.domain, agentId: id, agentVersion: ver, maxAttempts: 3 }] });
        await post(`/api/maf/tasks/${encodeURIComponent(created.task.id)}/run`, {}); await loadMaf(); toast("✓ TaskAgent 持久任务已完成");
      } else if (act === "run-task") { await post(`/api/maf/tasks/${encodeURIComponent(id)}/run`, {}); await loadMaf(); toast("✓ 任务运行/恢复完成"); }
      else if (act === "cancel-task") await mafPost(`/api/maf/tasks/${encodeURIComponent(id)}/cancel`, {}, "取消请求生效");
      else if (act === "reproduce") window.open(`/api/maf/reproduce/${encodeURIComponent(id)}/${encodeURIComponent(ver)}`, "_blank");
      else if (act === "export") {
        const blob = new Blob([JSON.stringify({ foundry: state.maf, tasks: state.mafTasks, orchestration: state.mafAudit }, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = "maf-audit.json"; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
    } catch (e) { toast(`✗ ${e.message}`); }
  });
}
function renderPanel() {
  const mafView = state.tab === "maf";
  document.querySelectorAll(".wb-scope, .wb-banner, .wb-actions").forEach((el) => el.style.display = mafView ? "none" : "");
  if (state.tab === "trace") renderTrace();
  else if (state.tab === "maf") renderMaf();
  else if (state.tab === "rebuild") renderRebuild();
  else if (state.tab === "metrics") renderMetrics();
  else if (state.tab === "tools") renderTools();
  else renderSkills();
}
async function loadReplay() {
  try {
    const d = await api("/api/whitebox/replay");
    state.replayEvents = (d.events || []).map((e) => ({ ...e, _src: "replay" }));
  } catch { state.replayEvents = []; }
  if (state.tab === "trace") renderTrace();
}

async function loadGlobalHistory() {
  state.globalEvents = []; state.ledgerMaxSeq = {};
  let cursor = 0, guard = 0;
  while (cursor !== null && guard < 40) {
    const d = await api(`/api/maf/events?limit=500&cursor=${cursor}`);
    for (const e of d.events) {
      state.globalEvents.push({ ...e, _src: "ledger", _task: e.sessionId });
      state.ledgerMaxSeq[e.sessionId] = Math.max(state.ledgerMaxSeq[e.sessionId] || 0, e.seq || 0);
    }
    cursor = d.nextCursor; guard += 1;
  }
  state.globalEvents.sort(byTimeline);
  if (state.tab === "trace") renderTrace();
}
function connectGlobalStream() {
  const es = new EventSource("/api/events/stream" + (localStorage.getItem("agentos_token") ? "?token=" + encodeURIComponent(localStorage.getItem("agentos_token")) : ""));
  es.addEventListener("snapshot", (m) => { applyRunning(JSON.parse(m.data).active || []); });
  es.addEventListener("running-snapshot", (m) => { applyRunning(JSON.parse(m.data).active || []); });
  es.addEventListener("event", (m) => {
    const e = JSON.parse(m.data);
    if ((e.seq || 0) <= (state.ledgerMaxSeq[e.sessionId] || 0)) return;
    state.globalEvents.push({ ...e, _src: "live", _task: e.sessionId || "" });
    state.ledgerMaxSeq[e.sessionId] = e.seq || 0;
    state.globalEvents.sort(byTimeline);
    if (state.tab === "trace") renderTrace();
  });
  es.onerror = () => { $("#dot").style.background = "var(--warn)"; };
}
function applyRunning(active) {
  state.running = new Set(active);
  $("#runCount").textContent = active.length ? `● ${active.length} 运行中` : "";
  loadSessions();
  if (state.tab === "trace") renderTrace();
}

async function loadStatus() {
  state.status = await api("/api/status");
  const ps = $("#presetSel");
  ps.innerHTML = state.status.presets.map((p) => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join("");
  const ms = $("#modelSel");
  ms.innerHTML = state.status.models.map((m) => `<option value="${esc(m.name)}" ${m.name === state.status.model ? "selected" : ""}>${esc(m.name)}${m.failures ? ` (${m.failures} 失败)` : ""}</option>`).join("");
  $("#statusText").textContent = `${state.status.model} · ${state.status.permission}`;
  $("#dot").style.background = "var(--ok)";
  $("#runtimeInfo").innerHTML = `工具 <b>${state.status.tools.length}</b> · 技能 <b>${state.status.skills.length}</b> · Hook <b>${state.status.hooks}</b><br/>插件 ${esc((state.status.plugins.loaded || []).join(", ") || "无")}<br/>会话 <b>${state.status.sessionCount}</b>`;
}

async function loadSessions() {
  const d = await api("/api/sessions");
  const box = $("#sessions");
  for (const s of d.sessions) state.sessionTitles[s.id] = s.title;
  box.innerHTML = d.sessions.length ? d.sessions.map((s) =>
    `<div class="sess ${s.id === state.sessionId ? "active" : ""}" data-id="${esc(s.id)}"><div class="t">${state.running.has(s.id) ? '<span class="run"></span>' : ""}${esc(s.title)}</div><div class="m">${esc(s.preset)} · ${state.running.has(s.id) ? "运行中" : esc(s.status)} · ${esc(String(s.updatedAt).slice(5, 16))}</div></div>`).join("") : '<div class="empty">暂无会话</div>';
  box.querySelectorAll(".sess").forEach((el) => el.onclick = () => selectSession(el.dataset.id));
}

async function selectSession(id) {
  state.sessionId = id;
  state.traceEvents = [];
  state.calls = {};
  $("#stream").innerHTML = "";
  const d = await api(`/api/trace?session=${encodeURIComponent(id)}&limit=300`);
  state.traceEvents = d.events.map((e) => ({ ...e, _src: "ledger" }));
  for (const e of d.events) {
    const p = e.payload || {};
    if (e.type === "message.user") addMsg("user", p.content || "");
    else if (e.type === "message.assistant" && (p.content || "").trim()) addMsg("assistant", p.content || "");
    else if (e.type === "tool.call") for (const c of (p.calls || [])) addToolCard(c);
    else if (e.type === "tool.result") finishToolCard(p.result || {});
  }
  await loadSessions();
  renderPanel();
}

async function newSession() {
  const d = await api("/api/sessions", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ preset: $("#presetSel").value }) });
  state.sessionId = d.session.id;
  state.traceEvents = []; state.calls = {};
  $("#stream").innerHTML = "";
  addMsg("system", `已创建会话 ${d.session.id} · Preset ${d.session.preset}。输入任务开始。`);
  await loadSessions(); renderPanel();
}

$("#sendBtn").onclick = send;
$("#input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
$("#newBtn").onclick = newSession;
$("#forkBtn").onclick = async () => {
  if (!state.sessionId) return;
  try { const d = await post("/api/fork", { sessionId: state.sessionId }); state.sessionId = d.session.id; await loadSessions(); await selectSession(state.sessionId); }
  catch (e) { alert(e.message); }
};
$("#presetSel").onchange = newSession;
$("#modelSel").onchange = async (e) => { try { await post("/api/model", { name: e.target.value }); await loadStatus(); } catch (err) { alert(err.message); } };
document.querySelectorAll(".tab").forEach((t) => t.onclick = () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.remove("on"));
  t.classList.add("on"); state.tab = t.dataset.tab;
  if (state.tab === "metrics") api("/api/metrics").then((d) => { state.status.metrics = d.metrics; });
  if (state.tab === "maf") loadMaf().catch((e) => toast(`✗ MAF 加载失败: ${e.message}`));
  renderPanel();
});
document.querySelectorAll(".wb-scope button").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".wb-scope button").forEach((x) => x.classList.remove("on"));
  b.classList.add("on"); state.scope = b.dataset.scope; state.tab = "trace";
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x.dataset.tab === "trace"));
  renderPanel();
});
$("#rebuildBtn").onclick = () => { state.tab = "rebuild"; document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x.dataset.tab === "rebuild")); renderPanel(); };
$("#tamperBtn").onclick = tamperSelfTest;
$("#exportBtn").onclick = exportSnapshot;
document.querySelectorAll("[data-dec]").forEach((b) => b.onclick = async () => {
  if (!state.approvalId) return;
  try { await post(`/api/approvals/${encodeURIComponent(state.approvalId)}`, { decision: b.dataset.dec }); }
  catch (e) { alert(e.message); }
  hideApproval();
});

(async () => {
  try {
    await loadStatus();
    await loadSessions();
    await loadGlobalHistory();
    connectGlobalStream();
    if (state.status.sessionCount > 0) {
      const d = await api("/api/sessions");
      await selectSession(d.sessions[0].id);
    } else await newSession();
    await loadReplay();
    renderPanel();
  } catch (e) { $("#statusText").textContent = `连接失败: ${e.message}`; $("#dot").style.background = "var(--err)"; }
})();
</script>
</body>
</html>
